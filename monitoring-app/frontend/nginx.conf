# Nginx configuration — React SPA + FastAPI reverse proxy
# ─────────────────────────────────────────────────────────

server {
    listen 80;

    # Accept requests addressed to any hostname or IP
    # (works for localhost, LAN IP, or a DNS hostname)
    server_name _;

    # ── Static React bundle ───────────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths return index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
        # Prevent caching of the SPA entry point so users always get the latest build
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Long-lived cache for content-hashed static assets (JS/CSS/fonts/images)
    # CRA builds filenames like main.abc12345.js — safe to cache for 1 year
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ── API proxy → FastAPI backend ───────────────────────────────────────────
    # All /api/* requests are proxied to the backend container.
    # The backend service name "backend" is resolved by Docker's internal DNS.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        # Pass the original client information through
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow up to 90 s for slow hypervisor responses
        # (KVM does 2 × /proc/stat reads with a 1 s sleep; ESXi/WinRM can be slow)
        proxy_read_timeout  90s;
        proxy_send_timeout  90s;
        proxy_connect_timeout 10s;
    }

    # ── Health endpoint proxy ─────────────────────────────────────────────────
    location /health {
        proxy_pass http://backend:8000;
    }

    # ── Swagger UI proxy (optional — useful for API testing from the browser) ─
    location /docs {
        proxy_pass http://backend:8000;
    }
    location /openapi.json {
        proxy_pass http://backend:8000;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy       "no-referrer"  always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/json
                    application/javascript text/xml application/xml
                    image/svg+xml;
    gzip_min_length 256;
}
